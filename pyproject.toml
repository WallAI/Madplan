[project]
name = "madplan"
version = "0.1.0"
description = "Madplan og indkøb på nemlig.com ud fra din ordrehistorik"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "nemlig-shopper>=1.0.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
madplan = "madplan.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["madplan"]

[tool.setuptools.package-data]
madplan = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
